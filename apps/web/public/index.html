<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tripsync</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: #fafaf7; }
      .app { max-width: 480px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
      header { padding: 12px 16px; border-bottom: 1px solid #eee; background: #fff; position: sticky; top: 0; }
      header h1 { margin: 0; font-size: 16px; }
      header p { margin: 2px 0 0; font-size: 12px; color: #777; }
      #thread { flex: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
      .msg { max-width: 80%; padding: 10px 12px; border-radius: 12px; font-size: 14px; line-height: 1.45; }
      .me { align-self: flex-end; background: #1d4ed8; color: #fff; border-bottom-right-radius: 4px; }
      .agent { align-self: flex-start; background: #fff; color: #111; border: 1px solid #e6e6e2; border-bottom-left-radius: 4px; }
      .author { font-size: 11px; color: #999; margin-bottom: 2px; }
      .trace { font-size: 11px; color: #999; align-self: flex-start; padding: 4px 8px; }
      form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #eee; background: #fff; }
      #trace-panel { border-top: 1px solid #eee; background: #fff; font-size: 12px; }
      #trace-toggle { width: 100%; padding: 8px 16px; text-align: left; background: none; border: none; border-radius: 0; font-size: 12px; color: #555; cursor: pointer; }
      #trace-body { display: none; padding: 0 16px 12px; overflow-x: auto; }
      #trace-body.open { display: block; }
      .trace-turn { margin-bottom: 10px; }
      .trace-turn summary { font-weight: 600; color: #333; cursor: pointer; padding: 2px 0; }
      .trace-turn ol { margin: 4px 0 0 0; padding-left: 20px; color: #555; }
      .trace-turn li { margin: 2px 0; font-family: monospace; font-size: 11px; }
      input { flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 999px; font-size: 16px; }
      button { padding: 10px 16px; border: 0; border-radius: 999px; background: #111; color: #fff; font-size: 14px; }
      select { padding: 6px 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Tripsync — Boston Crew, Tokyo 5/26-5/30</h1>
        <p>Agent: planning. <label>You: <select id="who"><option>seo</option><option>jamie</option><option>min</option></select></label></p>
      </header>
      <div id="thread"></div>
      <form id="form">
        <input id="text" placeholder="say something..." autocomplete="off" />
        <button>send</button>
      </form>
      <div id="trace-panel">
        <button id="trace-toggle">▶ agent tool trace (0 turns)</button>
        <div id="trace-body"></div>
      </div>
    </div>
    <script>
      const API = location.origin.replace(/:\d+$/, ":4000");
      const TRIP_ID = "trip_tokyo_2026_05";
      const thread = document.getElementById("thread");
      const form = document.getElementById("form");
      const text = document.getElementById("text");
      const who = document.getElementById("who");

      function add(cls, author, body) {
        const div = document.createElement("div");
        div.className = "msg " + cls;
        div.innerHTML = "<div class='author'>" + author + "</div>" + body.replace(/</g, "&lt;");
        thread.appendChild(div);
        thread.scrollTop = thread.scrollHeight;
      }
      function trace(calls) {
        const div = document.createElement("div");
        div.className = "trace";
        div.textContent = "agent tools: " + calls.map(c => c.name).join(" -> ");
        thread.appendChild(div);
      }

      const traceToggle = document.getElementById("trace-toggle");
      const traceBody = document.getElementById("trace-body");
      traceToggle.addEventListener("click", () => traceBody.classList.toggle("open"));

      async function refreshTrace() {
        try {
          const r = await fetch(API + "/trace/" + TRIP_ID);
          const turns = await r.json();
          traceToggle.textContent = (traceBody.classList.contains("open") ? "▼" : "▶") + " agent tool trace (" + turns.length + " turns)";
          traceBody.innerHTML = turns.map((t, i) => {
            const calls = (t.calls || []).map(c => "<li>" + c.name + "(" + JSON.stringify(c.args).slice(0, 60) + "…)</li>").join("");
            return "<details class='trace-turn'><summary>Turn " + (i + 1) + " — " + (t.calls || []).map(c => c.name).join(" → ") + "</summary><ol>" + calls + "</ol><div style='color:#777;padding:4px 0'>" + (t.reply || "") + "</div></details>";
          }).join("") || "<p style='color:#aaa;margin:4px 0'>no traces yet</p>";
        } catch (_) {}
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const body = text.value.trim();
        if (!body) return;
        const author = who.value;
        add("me", author, body);
        text.value = "";
        try {
          const r = await fetch(API + "/chat", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ trip_id: TRIP_ID, author, text: body }),
          });
          const j = await r.json();
          if (j.tool_calls && j.tool_calls.length) trace(j.tool_calls);
          if (j.reply) add("agent", "agent", j.reply);
          await refreshTrace();
        } catch (err) {
          add("agent", "system", "request failed: " + err.message);
        }
      });
    </script>
  </body>
</html>
